[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simorph"
version = "0.4.0"
description = "Настольная среда калибровки бортовых конвейеров патрульного робота"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "roman1979" }]
keywords = ["robotics", "simulation", "calibration", "pybullet", "stereo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PySide6>=6.12,<7",
  "pybullet>=3.2.7,<4",
  "opencv-contrib-python>=5.1,<6",
  "numpy>=2.5,<3",
  "torch>=2.15,<3",
  "openvino>=2026.4,<2027",
  "pydantic>=2.14,<3",
  "Jinja2>=3.1,<4",
  "panel>=1.10,<2",
  "bokeh>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-qt>=4.5,<5",
  "pytest-cov>=7,<8",
  "ruff>=0.17,<1",
  "mypy>=2.4,<3",
  "pip-tools>=7.7,<8",
  "pip-licenses>=5.5,<6",
  "pre-commit>=4.7,<5",
]

[project.scripts]
simorph = "simorph.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simorph = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PTH", "DTZ", "A"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# Qt требует camelCase в переопределяемых методах моделей и виджетов.
"src/simorph/ui/tree_model.py" = ["N802"]
"src/simorph/ui/main_window.py" = ["N802"]
"src/simorph/ui/tabs.py" = ["N802"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src/simorph"]

[[tool.mypy.overrides]]
module = ["pybullet", "openvino", "bokeh.*", "panel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
qt_api = "pyside6"
markers = [
  "unit: быстрые модульные тесты",
  "integration: тесты с процессами, файлами и внешними библиотеками",
  "ui: тесты Qt-интерфейса, требуют offscreen или дисплей",
  "perf: тесты производительности, чувствительны к железу",
  "regression: эталонные (golden) проверки",
]

[tool.coverage.run]
source = ["simorph"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
